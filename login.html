<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Plotscope</title>
  </head>
  <body>
    <main class="page">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><rect width="32" height="32" rx="7" class="mark-bg" /><path d="M8 22 13 9l6 4 5 9z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" /><circle cx="13" cy="9" r="2.2" fill="#fff" /></svg>
        <span>Plotscope</span>
      </div>

      <form id="form" class="card" novalidate>
        <h1 id="heading">Sign in</h1>
        <p id="intro" class="intro">Use the email and password your administrator gave you.</p>

        <div id="setup-fields" class="fields" hidden>
          <div class="field">
            <label for="code">Setup code</label>
            <input id="code" name="code" autocomplete="one-time-code" spellcheck="false" />
          </div>
          <div class="field">
            <label for="name">Your name <span class="opt">(optional)</span></label>
            <input id="name" name="name" autocomplete="name" />
          </div>
        </div>

        <div id="login-fields" class="fields">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="show" data-for="password" aria-label="Show password">Show</button>
            </div>
            <ul id="pw-meter" class="rules" hidden>
              <li id="rule-len">10 or more characters</li>
              <li id="rule-mix">Letters and at least one number or symbol</li>
            </ul>
          </div>
        </div>

        <div id="change-fields" class="fields" hidden>
          <div class="field">
            <label for="newpw">New password</label>
            <div class="pw">
              <input id="newpw" type="password" autocomplete="new-password" />
              <button type="button" class="show" data-for="newpw" aria-label="Show password">Show</button>
            </div>
            <ul id="newpw-meter" class="rules">
              <li id="newrule-len">10 or more characters</li>
              <li id="newrule-mix">Letters and at least one number or symbol</li>
            </ul>
          </div>
        </div>

        <p id="error" class="error" role="alert" hidden></p>
        <button id="submit" class="submit" type="submit"><span id="submit-label">Sign in</span><span class="spin" aria-hidden="true"></span></button>
      </form>

      <p id="footer" class="foot">Forgotten your password? Your Plotscope administrator can reset it.</p>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
