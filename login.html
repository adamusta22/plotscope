<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Plotscope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="login">
      <aside class="brand" aria-hidden="true">
        <svg class="plots" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
          <g fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M-20 80 L120 40 L170 190 L20 240Z" /><path d="M120 40 L260 10 L300 150 L170 190Z" /><path d="M260 10 L420 -20 L430 120 L300 150Z" />
            <path d="M20 240 L170 190 L210 330 L50 380Z" /><path d="M170 190 L300 150 L340 290 L210 330Z" /><path d="M300 150 L430 120 L440 260 L340 290Z" />
            <path d="M50 380 L210 330 L240 470 L80 520Z" /><path d="M210 330 L340 290 L370 430 L240 470Z" /><path d="M340 290 L440 260 L450 400 L370 430Z" />
            <path d="M80 520 L240 470 L260 640 L90 660Z" /><path d="M240 470 L370 430 L390 620 L260 640Z" />
          </g>
          <path class="hi" d="M170 190 L300 150 L340 290 L210 330Z" />
        </svg>
        <div class="brand-copy">
          <div class="logo">
            <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="9" fill="#fff" fill-opacity="0.16" /><path d="M8 22 13 9l6 4 5 9z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" /><circle cx="13" cy="9" r="2.2" fill="#fff" /></svg>
            <span>Plotscope</span>
          </div>
          <p class="tagline">Find, assess and appraise development land across England and Wales.</p>
        </div>
      </aside>

      <section class="panel">
        <form id="form" class="card" novalidate>
          <h1 id="heading">Sign in</h1>
          <p id="intro" class="muted">Use the email and password your administrator gave you.</p>

          <div id="setup-fields" hidden>
            <label for="code">Setup code</label>
            <input id="code" name="code" autocomplete="one-time-code" />
            <label for="name">Your name</label>
            <input id="name" name="name" autocomplete="name" />
          </div>

          <div id="login-fields">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" class="show" data-for="password">Show</button>
            </div>
          </div>

          <div id="change-fields" hidden>
            <label for="newpw">New password</label>
            <div class="pw">
              <input id="newpw" type="password" autocomplete="new-password" />
              <button type="button" class="show" data-for="newpw">Show</button>
            </div>
            <p class="hint">At least 10 characters, with letters and numbers or symbols.</p>
          </div>

          <p id="error" class="error" role="alert" hidden></p>
          <button id="submit" class="submit" type="submit">Sign in</button>
          <p id="footer" class="muted small">Forgotten your password? Ask your Plotscope administrator to reset it.</p>
        </form>
      </section>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
