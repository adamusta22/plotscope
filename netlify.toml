[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Sign-in page
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Same-origin proxy to HM Land Registry's INSPIRE plot boundaries service
[[redirects]]
  from = "/lr/*"
  to = "https://inspire.landregistry.gov.uk/:splat"
  status = 200
  force = true

# Long-lived caching for fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
