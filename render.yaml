# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: plotscope
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false        # you'll be asked for it in the Render dashboard
      - key: APP_PASSWORD
        sync: false        # optional: password-protect the whole site
      - key: AGENT_REQUESTS_PER_HOUR
        value: "30"
